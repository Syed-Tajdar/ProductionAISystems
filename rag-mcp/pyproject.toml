[project]
name = "rag-mcp"
version = "0.1.0"
description = "Bilingual document Q&A with cited answers over Postgres pgvector"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "anthropic>=2.4,<3",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "mcp>=2.3,<3",
  "jinja2>=3.1",
]

[project.scripts]
rag-mcp = "rag.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright==1.63.0"]  # playwright: the browser smoke test
# Only for scripts/build_documents.py, which renders the PDF and DOCX test documents.
documents = ["reportlab>=4.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.setuptools.package-data]
rag = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "profile.json"]

# Vercel: the FastAPI app this project serves (page, JSON API and /mcp; one Vercel Function, Fluid compute).
[tool.vercel]
entrypoint = "rag.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
