# n8n + Postgres (n8n's own database). Lead data lives in Supabase, not here.
# Works with `docker compose up -d` locally or on a VPS, and maps 1:1 to
# Railway services (one image and at most one volume per service).
# Render cannot run Compose; use render.yaml there. See DEPLOY.md.

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.45.0}
    restart: unless-stopped
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Encrypts saved credentials. Losing it means re-entering every credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_PORT: 5678
      # n8n defaults to "::" (IPv6). Use 0.0.0.0 on hosts without IPv6.
      N8N_LISTEN_ADDRESS: ${N8N_LISTEN_ADDRESS:-::}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Dubai}
      TZ: ${GENERIC_TIMEZONE:-Asia/Dubai}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      # The lead workflows read their deployment settings from LEADS_* variables (see .env.example).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      LEADS_SUPABASE_URL: ${LEADS_SUPABASE_URL:-}
      LEADS_BUSINESS_NAME: ${LEADS_BUSINESS_NAME:-}
      LEADS_SALES_CHAT_ID: ${LEADS_SALES_CHAT_ID:-}
      LEADS_OPS_CHAT_ID: ${LEADS_OPS_CHAT_ID:-}
      LEADS_EMAIL_FROM: ${LEADS_EMAIL_FROM:-}
      LEADS_EMAIL_REPLY_TO: ${LEADS_EMAIL_REPLY_TO:-}
      LEADS_DEFAULT_COUNTRY_CODE: ${LEADS_DEFAULT_COUNTRY_CODE:-971}
      LEADS_DEMO_MODE: ${LEADS_DEMO_MODE:-false}
      LEADS_DEMO_PER_VISITOR: ${LEADS_DEMO_PER_VISITOR:-5}
      LEADS_DEMO_WINDOW_MINUTES: ${LEADS_DEMO_WINDOW_MINUTES:-10}
      LEADS_DEMO_DAILY_CAP: ${LEADS_DEMO_DAILY_CAP:-100}
      LEADS_DEMO_ALERTS_PER_DAY: ${LEADS_DEMO_ALERTS_PER_DAY:-20}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Local email testing: n8n's SMTP credential points at mailpit:1025, and every email the
  # workflows send shows up at http://localhost:8025. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.33.0}
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
  n8n_data:
