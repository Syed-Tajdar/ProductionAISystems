# Local test bench for the n8n mini automations: n8n (SQLite) plus a mock
# server that stands in for the Claude, WhatsApp, Telegram, Supabase, HubSpot, Google Sheets and Gemini APIs.
# Driven by harness.py. Not for production.
name: mini-automations-test

services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.45.0}
    ports:
      - "${N8N_TEST_PORT:-5679}:5678"
    environment:
      N8N_ENCRYPTION_KEY: local-test-bench-only
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Dubai
      TZ: Asia/Dubai
      # whatsapp-lead-qualifier verifies Meta's signature in a Code node
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      WHATSAPP_APP_SECRET: test-app-secret
      WHATSAPP_DRY_RUN_TOKEN: test-dry-run-token
    volumes:
      - n8n_test_data:/home/node/.n8n
    depends_on:
      - mock

  mock:
    image: n8nio/n8n:${N8N_VERSION:-2.45.0}
    entrypoint: ["node", "/mock/mock_api.js"]
    ports:
      - "${MOCK_PORT:-8090}:8090"
    volumes:
      - ./mock_api.js:/mock/mock_api.js:ro

volumes:
  n8n_test_data:
